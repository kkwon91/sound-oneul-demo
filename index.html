<title>사운드 오늘 대시보드</title>

<style>
/* 레이아웃: 믹싱 콘솔 — 맨 위 마스터 스트립(이번 달 숫자), 그 아래 큐 리스트(다가오는 현장), 채널 스트립처럼 쌓인 패널 */
:root{
  --bg:#EEF2F0; --panel:#FFFFFF; --panel-2:#F5F8F6; --hover:#EAF0EC;
  --ink:#0E1311; --ink-2:#46514C; --muted:#6F7A75; --line:#DCE3DF; --line-strong:#C3CDC8;
  --brand:#27FF14; --on-brand:#08120A;
  --accent:#147A2B; --accent-soft:#E2F4E4;
  --g1:#76C482; --g2:#43A555; --g3:#1E8A35; --g4:#0B5E21;
  --warn:#B4511A; --warn-soft:#FCEBDD; --crit:#C23131; --crit-soft:#FBE4E4; --info:#2459B8; --info-soft:#E3ECFA;
  --toast-act:#7CF06C; --scrim:rgba(6,10,8,.42); --shadow:0 1px 2px rgba(14,19,17,.05),0 8px 28px rgba(14,19,17,.10);
  --font:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D0C; --panel:#131816; --panel-2:#18201C; --hover:#1D2622;
  --ink:#EDF3EF; --ink-2:#AAB6B0; --muted:#7D8883; --line:#232C28; --line-strong:#33403A;
  --brand:#27FF14; --on-brand:#06100A;
  --accent:#4BE05A; --accent-soft:#132D18;
  --g1:#1E5A28; --g2:#2A8C3A; --g3:#3CC44E; --g4:#7CF06C;
  --warn:#F2914F; --warn-soft:#352214; --crit:#F26A6A; --crit-soft:#3A1818; --info:#7AA8F5; --info-soft:#16243C;
  --toast-act:#147A2B; --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0D0C; --panel:#131816; --panel-2:#18201C; --hover:#1D2622;
  --ink:#EDF3EF; --ink-2:#AAB6B0; --muted:#7D8883; --line:#232C28; --line-strong:#33403A;
  --brand:#27FF14; --on-brand:#06100A;
  --accent:#4BE05A; --accent-soft:#132D18;
  --g1:#1E5A28; --g2:#2A8C3A; --g3:#3CC44E; --g4:#7CF06C;
  --warn:#F2914F; --warn-soft:#352214; --crit:#F26A6A; --crit-soft:#3A1818; --info:#7AA8F5; --info-soft:#16243C;
  --toast-act:#147A2B; --scrim:rgba(0,0,0,.6); --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;padding-inline:24px;padding-block:0 72px}
@media (max-width:640px){.app{padding-inline:16px}}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:14px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.logo{position:relative;display:block;width:96px;aspect-ratio:327/132;flex:none}
.logo i{position:absolute;inset:0;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}

.brand-txt{display:flex;flex-direction:column;line-height:1.25;border-left:1px solid var(--line-strong);padding-left:12px}
.brand-txt b{font-size:15px}
.brand-txt span{font-size:12px;color:var(--muted)}
.meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink-2)}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.04em}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:var(--g3);box-shadow:0 0 0 3px var(--accent-soft)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:2px 10px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:transparent;font-weight:600;color:var(--ink-2);padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{background:var(--hover)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.badge{font-family:var(--mono);font-size:11px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;background:var(--crit);color:#fff}

/* 버튼 */
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.brand{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{appearance:none;border:0;background:transparent;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--ink-2);display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.linkish{appearance:none;border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13px}

/* 안내 띠 */
.banner{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--panel-2);font-size:13px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner .btn{margin-left:auto}

/* 패널 */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media (max-width:1020px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
@media (min-width:700px) and (max-width:1020px){.c4.half,.c6.half{grid-column:span 6}}
@media (max-width:640px){.panel{padding:16px}}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font-size:15px;font-weight:700;margin:0}
.ph .sub{font-size:12px;color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:10px;align-items:center}

/* KPI */
.kpis{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.hero{grid-row:span 2;background:var(--brand);color:var(--on-brand);border-radius:var(--r);padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;min-width:0}
.hero .eyebrow{color:var(--on-brand);opacity:.72}
.hero .val{font-size:clamp(44px,5.2vw,60px);font-weight:700;letter-spacing:-.025em;line-height:1;margin-top:10px}
.hero .val small{font-size:.42em;font-weight:600;margin-left:4px;letter-spacing:0}
.hero .exact{font-size:13px;opacity:.75;margin-top:8px}
.hero .split{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.hero .split div{display:flex;flex-direction:column}
.hero .split b{font-size:17px}
.hero .delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;background:rgba(8,18,10,.1);padding:3px 9px;border-radius:999px;align-self:flex-start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left;cursor:pointer;appearance:none;font:inherit;color:inherit}
.tile:hover{border-color:var(--line-strong)}
.tile .lbl{font-size:13px;color:var(--ink-2);font-weight:600}

<script>
(() => {
"use strict";
/* ───────── 상수 ───────── */
const TYPES = ["행사 음향","공연·콘서트","장비 대여","설치·시공","기술 컨설팅"];

const GEAR0 = ["TT515-A","SUB8008-AS","IEM G4","LV1","DM3","AD4Q","AD2","FreeSpeak II","Solidcom C1"];

const STATUS = {quote:"견적·문의", confirmed:"확정", cancel:"취소"};
const INV = {todo:"미발행", issued:"발행", skip:"발행 안 함"};
const STAGE = {before:"행사 전", invoice:"계산서 발행 대기", collect:"입금 대기", paid:"입금 완료"};
const STAGE_SW = {before:"var(--g1)", invoice:"var(--g2)", collect:"var(--g3)", paid:"var(--g4)"};
const TABS = ["home","jobs","money","crew","settings"];
const DEMO_SITE = true; /* 체험판 빌드(tools/build-demo.mjs)에서 true로 바뀜: 예시 데이터 + 브라우저 저장 */

/* ───────── 날짜 ───────── */
const pad = n => String(n).padStart(2,"0");
const P = s => { const a = String(s).split("-").map(Number); return new Date(Date.UTC(a[0], (a[1]||1)-1, a[2]||1)); };
const S2 = d => d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
const addD = (s,n) => { const d = P(s); d.setUTCDate(d.getUTCDate()+n); return S2(d); };
const diffD = (a,b) => Math.round((P(b)-P(a))/864e5);
const _n = new Date();
const TODAY = _n.getFullYear()+"-"+pad(_n.getMonth()+1)+"-"+pad(_n.getDate());
const YM = TODAY.slice(0,7), YEAR = +TODAY.slice(0,4);
const addM = (ym,n) => { let y=+ym.slice(0,4), m=+ym.slice(5,7)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+"-"+pad(m+1); };
const wd = s => WD[P(s).getUTCDay()];
const fmtD = s => { if(!s) return ""; const y=+s.slice(0,4); return (y!==YEAR ? String(y).slice(2)+"." : "")+(+s.slice(5,7))+"."+s.slice(8,10)+" ("+wd(s)+")"; };
const fmtDs = s => s ? (+s.slice(0,4)!==YEAR ? String(s).slice(2,4)+"." : "")+(+s.slice(5,7))+"."+s.slice(8,10) : "";
const ymLabel = ym => { const y=+ym.slice(0,4); return (y!==YEAR ? y+"년 " : "")+(+ym.slice(5,7))+"월"; };
const nowISO = () => new Date().toISOString();

/* ───────── 숫자 ───────── */
const won = n => Math.round(+n||0).toLocaleString("ko-KR");
function man(n){
  n = Math.round(+n||0); const neg = n<0; n = Math.abs(n); let s;
  if(n >= 1e8){ const e=n/1e8; s=(e>=10?e.toFixed(1):e.toFixed(2)).replace(/\.?0+$/,"")+"억"; }
  else if(n >= 1e4){ s=Math.round(n/1e4).toLocaleString("ko-KR")+"만"; }
  else s=n.toLocaleString("ko-KR");
  return (neg?"−":"")+s;
}
const num = v => { const n = parseInt(String(v??"").replace(/[^\d]/g,""),10); return isNaN(n)?0:n; };
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? null));
/* 사업소득 원천징수: 소득세 3% + 지방소득세(소득세의 10%), 각각 10원 미만 절사 */
function withhold(g){ const it=Math.floor(g*0.03/10)*10; const lt=Math.floor(it*0.1/10)*10; return it+lt; }
/* 세금계산서 발행 기한: 공급한 달의 다음 달 10일 */
function invoiceDue(end){ const ym=addM(end.slice(0,7),1); return ym+"-10"; }

/* ───────── 계산 ───────── */
const CC = new WeakMap();
function C(j){ let c=CC.get(j); if(!c){ c=calc(j); CC.set(j,c); } return c; }
function calc(j){
  const supply = +j.supply||0;
  const vat = j.vatOn===false ? 0 : Math.floor(supply*0.1);
  const total = supply+vat;
  let gross=0, wh=0, unpaidNet=0;
  (j.crew||[]).forEach(r => { const g=(+r.days||0)*(+r.rate||0); const t=withhold(g); gross+=g; wh+=t; if(!r.paid) unpaidNet+=g-t; });
  const other = (j.costs||[]).reduce((s,c)=>s+(+c.amount||0),0);
  const cost = gross+other, profit = supply-cost;
  const received = +j.received||0, remain = Math.max(0,total-received);
  const start = j.start||TODAY, end = (j.end && j.end>=start) ? j.end : start;
  const phase = j.status==="cancel" ? "cancel" : j.status==="quote" ? "quote" : TODAY<start ? "upcoming" : TODAY<=end ? "live" : "done";
  const inv = (j.invoice && j.invoice.status) || "todo";
  let stage = null;
  if(j.status==="confirmed"){
    if(total>0 && remain===0) stage="paid";
    else if(inv!=="todo") stage="collect";
    else if(TODAY>end) stage="invoice";
    else stage="before";
  }
  return {supply,vat,total,gross,wh,net:gross-wh,unpaidNet,other,cost,profit,margin:supply?profit/supply:0,received,remain,start,end,days:diffD(start,end)+1,phase,inv,stage,due:invoiceDue(end)};
}
function ageOf(j){ const c=C(j); if(c.stage==="collect") return diffD((j.invoice&&j.invoice.date)||c.end, TODAY); if(c.stage==="invoice") return diffD(c.end, TODAY); return 0; }

function flagsFor(jobs){
  const F = new Map();
  const add = (j,lv,s,t) => { if(!F.has(j.id)) F.set(j.id,[]); F.get(j.id).push({lv,s,t}); };
  const act = jobs.filter(j => j.status!=="cancel" && C(j).end>=TODAY);
  for(let a=0;a<act.length;a++) for(let b=a+1;b<act.length;b++){
    const A=act[a], B=act[b], ca=C(A), cb=C(B);
    if(ca.start>cb.end || cb.start>ca.end) continue;
    const na = new Set((A.crew||[]).map(r=>r.name).filter(Boolean));
    const both = [...new Set((B.crew||[]).map(r=>r.name).filter(n=>na.has(n)))];
    if(both.length){ add(A,"crit","인력 겹침",both.join(", ")+" — 같은 날 ‘"+B.title+"’에도 배정"); add(B,"crit","인력 겹침",both.join(", ")+" — 같은 날 ‘"+A.title+"’에도 배정"); }
    const ga = new Set(A.gear||[]); const gb = (B.gear||[]).filter(g=>ga.has(g));
    if(gb.length){ add(A,"warn","장비 확인",gb.join(", ")+" — 같은 날 ‘"+B.title+"’에서도 사용"); add(B,"warn","장비 확인",gb.join(", ")+" — 같은 날 ‘"+A.title+"’에서도 사용"); }
  }
  jobs.forEach(j => {
    const c=C(j); if(j.status==="cancel") return;
    if(j.status==="confirmed" && c.end>=TODAY && !(j.crew||[]).some(r=>r.name)) add(j,"warn","인력 미배정","아직 투입 인력을 넣지 않았어요");
    if(!c.supply) add(j,"warn","금액 미입력","공급가액이 비어 있어요");
    if(c.stage==="invoice" && TODAY>c.due) add(j,"crit","발행 기한 지남","세금계산서 발행 기한("+fmtDs(c.due)+")이 지났어요. 늦게 발행하면 가산세 대상이 될 수 있어요");
    if(c.stage==="collect"){ const age=ageOf(j); if(age>60) add(j,"crit",age+"일째 미입금","계산서 발행 후 "+age+"일 지났어요"); else if(age>30) add(j,"warn",age+"일째 미입금","계산서 발행 후 "+age+"일 지났어요"); }
  });
  return F;
}

const LKEY = "sound-oneul.ledger.v1";
const store = {
  local:null,
  async init(){

    } }catch(_){}
    if(db){
      S.db=db; S.mode="db";
      try{ if(user){ const c=await user.can("data.write"); if(c===false) S.canWrite=false; } }catch(_){}
      const got={j:0,c:0,s:0};
      const ready=()=>{ if(got.j&&got.c&&got.s) S.ready=true; render(); };
      const onErr=e=>{ if(e && e.code==="revoked"){ S.canWrite=false; } toast("저장소 연결이 끊겼어요. 페이지를 새로 열어 주세요."); };
      db.collection("jobs").onSnapshot(sn=>{ S.real.jobs=sn.docs.map(d=>Object.assign({id:d.id},clone(d.data()))); got.j=1; ready(); }, onErr);
      db.collection("crew").onSnapshot(sn=>{ S.real.crew=sn.docs.map(d=>Object.assign({id:d.id},clone(d.data()))); got.c=1; ready(); }, onErr);
      setTimeout(()=>{ if(!S.ready){ S.ready=true; render(); } }, 12000);
      db.doc("settings/main").onSnapshot(sn=>{ S.real.settings=sn.exists?clone(sn.data()):{}; got.s=1; ready(); }, onErr);
    } else {
      S.mode="local";
      try{ this.local=JSON.parse(localStorage.getItem(LKEY)||"null"); }catch(_){}
      if(!this.local) this.local={jobs:{},crew:{},settings:{}};
      this.sync(); S.ready=true; render();
    }
  },
  sync(){ const L=this.local; S.real.jobs=Object.entries(L.jobs).map(([id,v])=>Object.assign({id},v)); S.real.crew=Object.entries(L.crew).map(([id,v])=>Object.assign({id},v)); S.real.settings=Object.assign({},L.settings); },
  persist(){ try{ localStorage.setItem(LKEY, JSON.stringify(this.local)); }catch(_){ toast("이 브라우저에 저장하지 못했어요. 저장 공간을 확인해 주세요."); } this.sync(); render(); },
  newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); },
  async set(col,id,data){
    if(S.db){ const ref = id ? S.db.collection(col).doc(id) : S.db.collection(col).doc(); await retry(()=>ref.set(data)); return ref.id; }
    id = id || this.newId(); this.local[col][id]=data; this.persist(); return id;
  },
  async patch(col,id,patch){
    if(S.db){ await retry(()=>S.db.collection(col).doc(id).update(patch)); return; }
    const deep=(t,p)=>{ for(const k in p){ if(p[k] && typeof p[k]==="object" && !Array.isArray(p[k])){ t[k]=t[k]&&typeof t[k]==="object"?t[k]:{}; deep(t[k],p[k]); } else t[k]=p[k]; } };
    if(this.local[col][id]){ deep(this.local[col][id],patch); this.persist(); }
  },
  async del(col,id){
    if(S.db){ await retry(()=>S.db.collection(col).doc(id).delete()); return; }
    delete this.local[col][id]; this.persist();
  },
  async setSettings(data){
    if(S.db){ await retry(()=>S.db.doc("settings/main").set(data)); return; }
    this.local.settings=data; this.persist();
  }
};
async function retry(fn){
  try{ return await fn(); }
  catch(e){
    if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return await fn(); }
    throw e;
  }
}
function errMsg(e){
  const c = e && e.code;
  if(c==="invalid_argument"){ S.canWrite=false; render(); return "이 계정은 보기 권한만 있어 저장할 수 없어요."; }
  if(c==="quota_exceeded") return "저장 공간이 가득 찼어요. 오래된 현장을 정리해 주세요.";
  if(c==="resource_exhausted") return "요청이 몰렸어요. 잠시 뒤 다시 눌러 주세요.";
  return "저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.";
}
async function act(fn, okMsg, undo){
  if(S.busy) return false; S.busy=true;
  try{ await fn(); if(okMsg) toast(okMsg, undo); return true; }
  catch(e){ toast(errMsg(e)); return false; }
  finally{ S.busy=false; }
}

function crewTotals(jobs,ym){
  const m=new Map();
  jobs.filter(j=>j.status==="confirmed"&&(j.start||"").slice(0,7)===ym).forEach(j=>(j.crew||[]).forEach(r=>{
    if(!r.name) return; const g=(+r.days||0)*(+r.rate||0), t=withhold(g);
    const o=m.get(r.name)||{name:r.name,roles:{},jobs:0,days:0,gross:0,wh:0,net:0,unpaid:0}; o.roles[r.role]=(o.roles[r.role]||0)+1; o.jobs++; o.days+=(+r.days||0); o.gross+=g; o.wh+=t; o.net+=g-t; if(!r.paid) o.unpaid+=g-t; m.set(r.name,o);
  }));
  const rows=[...m.values()].sort((a,b)=>b.gross-a.gross);
  return {rows, days:rows.reduce((s,r)=>s+r.days,0), gross:rows.reduce((s,r)=>s+r.gross,0), wh:rows.reduce((s,r)=>s+r.wh,0), net:rows.reduce((s,r)=>s+r.net,0), unpaid:rows.reduce((s,r)=>s+r.unpaid,0)};
}

let MDATA=null;
function niceTicks(max){ const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const f=raw/p; const st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; const out=[]; for(let v=0; v<=max+st*1e-6; v+=st) out.push(v); if(out[out.length-1]<max) out.push(out[out.length-1]+st); return out; }
function barPath(x,y,w,h,round,cls){ if(h<=0) return ""; const r=round?Math.min(4,h,w/2):0; return `<path class="${cls}" d="M${x},${y+h}V${y+r}${r?`Q${x},${y} ${x+r},${y}`:""}H${x+w-r}${r?`Q${x+w},${y} ${x+w},${y+r}`:""}V${y+h}Z"/>`; }
function drawMonthly(){
  const el=document.getElementById("mchart"); if(!el||!MDATA) return;
  const W=Math.max(280,Math.floor(el.clientWidth)), H=230, L=46, Rr=4, T=24, B=30, ih=H-T-B;
  const max=Math.max(1,...MDATA.map(d=>d.done+d.plan)); const tk=niceTicks(max); const top=tk[tk.length-1];
  const y=v=>T+ih*(1-v/top); const band=(W-L-Rr)/MDATA.length; const bw=Math.min(24,Math.max(8,band*.56)); const narrow=band<36;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="월별 매출 막대 차트. 자세한 숫자는 아래 표로 보기에 있습니다.">`;
  tk.forEach(t=>{ const yy=Math.round(y(t))+.5; s+=`<line class="${t?"grid-l":"base"}" x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${yy+4}" text-anchor="end">${t?man(t):"0"}</text>`; });
  MDATA.forEach((d,i)=>{
    const x0=L+band*i, cx=x0+band/2, x=cx-bw/2, y0=y(0), cur=d.ym===YM, m=+d.ym.slice(5);
    s+=`<rect class="hit${cur?" cur":""}" data-mi="${i}" x="${x0+1}" y="${T-16}" width="${band-2}" height="${ih+16}" rx="6" tabindex="0" aria-label="${ymLabel(d.ym)} ${man(d.done+d.plan)}원"/>`;
    if(m===1 && i>0) s+=`<line class="sep" x1="${x0}" x2="${x0}" y1="${T-16}" y2="${y0}"/><text class="yr" x="${x0+4}" y="${T-6}">${d.ym.slice(0,4)}</text>`;
    if(d.done>0){ const yt=y(d.done); s+=barPath(x,yt,bw,y0-yt,!(d.plan>0),"b-done"); }
    if(d.plan>0){ const yb=d.done>0?y(d.done)-2:y0, yt=y(d.done+d.plan); s+=barPath(x,Math.min(yt,yb-1),bw,Math.max(1,yb-yt),true,"b-plan"); }
    s+=`<text class="ax${cur?" axcur":""}" x="${cx}" y="${H-10}" text-anchor="middle">${narrow?m:m+"월"}</text>`;
    if(cur && d.done+d.plan>0) s+=`<text class="vlab" x="${cx}" y="${y(d.done+d.plan)-7}" text-anchor="middle">${man(d.done+d.plan)}</text>`;
  });
  el.innerHTML=s+"</svg>";
}
function monthTip(i){ const d=MDATA[i]; return `<b>${ymLabel(d.ym)}${d.ym===YM?" (이번 달)":""}</b>
  <div class="r"><span><i class="sw" style="background:var(--g3)"></i>끝난 현장</span><span>${won(d.done)}원</span></div>
  <div class="r"><span><i class="sw" style="background:var(--g1)"></i>예정 현장</span><span>${won(d.plan)}원</span></div>
  <div class="r"><span>비용</span><span>${won(d.cost)}원</span></div>
  <div class="r"><span>이익</span><span>${won(d.profit)}원</span></div>
  <div class="r"><span>현장</span><span>${d.n}건</span></div>`; }

/* ───────── 현장 ───────── */
function renderJobs(d){
  const F=flagsFor(d.jobs);
  const years=[...new Set(d.jobs.map(j=>+(j.start||TODAY).slice(0,4)))].sort((a,b)=>b-a);
  let list=d.jobs.slice();
  const p=S.fPeriod;
  if(p==="year") list=list.filter(j=>+(j.start||"").slice(0,4)===YEAR);
  else if(p==="upcoming") list=list.filter(j=>C(j).end>=TODAY);
  else if(p==="month") list=list.filter(j=>(j.start||"").slice(0,7)===YM);
  else if(/^\d{4}$/.test(p)) list=list.filter(j=>(j.start||"").slice(0,4)===p);
  if(S.fStatus!=="all") list=list.filter(j=>j.status===S.fStatus);
  if(S.fType!=="all") list=list.filter(j=>j.type===S.fType);
  if(S.q.trim()){ const q=S.q.trim().toLowerCase(); list=list.filter(j=>[j.title,j.client,j.venue,j.memo,...(j.crew||[]).map(r=>r.name)].join(" ").toLowerCase().includes(q)); }
  list.sort((a,b)=>p==="upcoming"?(a.start<b.start?-1:1):(a.start<b.start?1:-1));
  const live=list.filter(j=>j.status!=="cancel");
  const T={supply:sumBy(live,c=>c.supply),cost:sumBy(live,c=>c.cost),profit:sumBy(live,c=>c.profit),remain:sumBy(live.filter(j=>j.status==="confirmed"),c=>["invoice","collect"].includes(c.stage)?c.remain:0)};
  view.innerHTML = `
  <div class="filters" role="search">
    <input type="search" id="f-q" placeholder="현장명·거래처·장소·인력 검색" value="${esc(S.q)}" aria-label="검색">
    <select id="f-period" aria-label="기간">
      <option value="year"${p==="year"?" selected":""}>${YEAR}년</option>
      <option value="month"${p==="month"?" selected":""}>이번 달</option>
      <option value="upcoming"${p==="upcoming"?" selected":""}>앞으로 나갈 현장</option>
      ${years.filter(y=>y!==YEAR).map(y=>`<option value="${y}"${p===String(y)?" selected":""}>${y}년</option>`).join("")}
      <option value="all"${p==="all"?" selected":""}>전체</option>
    </select>
    <select id="f-type" aria-label="유형"><option value="all">모든 유형</option>${TYPES.map(t=>`<option${S.fType===t?" selected":""}>${t}</option>`).join("")}</select>
    <div class="chips" role="group" aria-label="상태">${[["all","전체"],["confirmed","확정"],["quote","견적·문의"],["cancel","취소"]].map(([v,l])=>`<button class="chip" type="button" data-act="fstatus" data-v="${v}" aria-pressed="${S.fStatus===v}">${l}</button>`).join("")}</div>
  </div>
  <section class="panel" style="margin-top:14px">
    <div class="ph"><h2>현장 ${list.length}건</h2><span class="sub">공급가액 ${won(T.supply)}원 · 이익 ${won(T.profit)}원${T.remain?` · 받을 돈 ${won(T.remain)}원`:""}</span></div>
    ${list.length?`<div class="tbl"><table>
      <thead><tr><th>행사일</th><th>현장</th><th>유형</th><th>인력</th><th class="num">공급가액</th><th class="num">비용</th><th class="num">이익</th><th>계산서</th><th>입금</th><th>확인할 것</th></tr></thead>
      <tbody>${list.map(j=>{ const c=C(j); const fl=F.get(j.id)||[];
        const payPill = j.status!=="confirmed" ? `<span class="pill">${STATUS[j.status]}</span>` : c.stage==="paid"?'<span class="pill ok">완료</span>': c.received>0?`<span class="pill info">${man(c.received)} 받음</span>`:c.stage==="before"?'<span class="pill">행사 전</span>':'<span class="pill warn">대기</span>';
        const invPill = j.status!=="confirmed" ? '<span class="muted">—</span>' : c.inv==="issued"?`<span class="pill ok">발행 ${fmtDs(j.invoice.date)}</span>`:c.inv==="skip"?'<span class="pill plain">안 함</span>':c.stage==="invoice"?`<span class="pill ${TODAY>c.due?"crit":"warn"}">미발행</span>`:'<span class="pill">미발행</span>';
        return `<tr class="click${j.status==="cancel"?" cancel":""}" data-act="open" data-id="${esc(j.id)}" tabindex="0">
          <td><b>${fmtD(c.start)}</b>${c.days>1?`<div class="s">${c.days}일간</div>`:""}</td>
          <td style="white-space:normal;min-width:200px"><div class="t">${esc(j.title)}</div><div class="s">${esc(j.client||"거래처 미입력")}${j.venue?" · "+esc(j.venue):""}</div></td>
          <td>${esc(j.type||"")}</td>
          <td class="num">${(j.crew||[]).filter(r=>r.name).length||'<span class="muted">0</span>'}</td>
          <td class="num">${won(c.supply)}</td><td class="num">${won(c.cost)}</td>
          <td class="num${c.profit<0?" neg":""}">${won(c.profit)}${c.supply?`<div class="s">${Math.round(c.margin*100)}%</div>`:""}</td>
          <td>${invPill}</td><td>${payPill}</td>
          <td><span class="flags">${pills(fl,2)||'<span class="muted">—</span>'}</span></td></tr>`; }).join("")}</tbody>
      <tfoot><tr><td colspan="4">합계 (취소 제외)</td><td class="num">${won(T.supply)}</td><td class="num">${won(T.cost)}</td><td class="num${T.profit<0?" neg":""}">${won(T.profit)}</td><td colspan="3"></td></tr></tfoot>
    </table></div>`:`<div class="empty">조건에 맞는 현장이 없어요.</div>`}
  </section>`;
}

/* ───────── 계산서·수금 ───────── */
function renderMoney(d){
  const conf=d.jobs.filter(j=>j.status==="confirmed");
  const by=k=>conf.filter(j=>C(j).stage===k);
  const inv=by("invoice").sort((a,b)=>C(a).due<C(b).due?-1:1);
  const col=by("collect").sort((a,b)=>ageOf(b)-ageOf(a));
  const bef=by("before").sort((a,b)=>a.start<b.start?-1:1);
  const paid=by("paid").sort((a,b)=>(b.receivedAt||b.start)<(a.receivedAt||a.start)?-1:1);
  const paidShown=S.showPaidAll?paid:paid.slice(0,8);
  const canAct=S.canWrite;
  const card=(j,kind)=>{ const c=C(j); let s="", btn="";
    if(kind==="invoice"){ const over=TODAY>c.due; s=`행사 ${fmtDs(c.end)} 끝 · 발행 기한 <b class="${over?"neg":""}">${fmtDs(c.due)}</b>`; btn=canAct&&!j.demo?`<button class="btn sm" data-act="issue" data-id="${esc(j.id)}" type="button">오늘 날짜로 발행 처리</button>`:""; if(over) s+=` <span class="pill crit">기한 지남</span>`; }
    if(kind==="collect"){ const age=ageOf(j); s=`${c.inv==="issued"?"발행 "+fmtDs(j.invoice.date):"계산서 없이 청구"} · ${age}일째`+(c.received?` · ${man(c.received)}원 받음`:""); btn=canAct&&!j.demo?`<button class="btn sm" data-act="paid" data-id="${esc(j.id)}" type="button">남은 ${man(c.remain)}원 입금 확인</button>`:""; if(age>30) s+=` <span class="pill ${age>60?"crit":"warn"}">${age>60?"독촉 필요":"30일 넘음"}</span>`; }
    if(kind==="before"){ s=`행사 ${fmtD(c.start)}`+(c.received?` · 계약금 ${man(c.received)}원 받음`:""); }
    if(kind==="paid"){ s=`입금 ${fmtDs(j.receivedAt)||"날짜 미입력"}${c.inv==="skip"?" · 카드·현금":""}`; }
    const amt = kind==="paid" ? c.total : c.remain;
    return `<article class="card" data-act="open" data-id="${esc(j.id)}" tabindex="0"><div class="top-r"><span class="t">${esc(j.title)}</span><span class="m">${won(amt)}</span></div><div class="s">${esc(j.client||"거래처 미입력")}</div><div class="s">${s}</div>${btn?`<div class="acts">${btn}</div>`:""}</article>`; };
  const colH=(k,arr,amtF,note)=>`<div class="col-h"><i class="sw" style="background:${STAGE_SW[k]}"></i><b>${STAGE[k]}</b><span class="cnt">${arr.length}</span><span class="sum">${man(sumBy(arr,amtF))}</span></div>${note?`<div class="hint" style="padding:0 4px">${note}</div>`:""}`;
  const emptyC=t=>`<div class="empty" style="padding:16px 4px">${t}</div>`;
  view.innerHTML = `
  <div class="board">
    <section class="col" aria-label="${STAGE.invoice}">${colH("invoice",inv,c=>c.remain,"행사가 끝났는데 아직 세금계산서를 안 낸 현장 · 기한은 다음 달 10일")}${inv.map(j=>card(j,"invoice")).join("")||emptyC("밀린 계산서가 없어요")}</section>
    <section class="col" aria-label="${STAGE.collect}">${colH("collect",col,c=>c.remain,"계산서는 나갔고 돈이 덜 들어온 현장")}${col.map(j=>card(j,"collect")).join("")||emptyC("받을 돈이 없어요")}</section>
    <section class="col" aria-label="${STAGE.before}">${colH("before",bef,c=>c.remain,"아직 행사 전인 확정 현장")}${bef.map(j=>card(j,"before")).join("")||emptyC("예정된 확정 현장이 없어요")}</section>
    <section class="col" aria-label="${STAGE.paid}">${colH("paid",paid,c=>c.total,"")}${paidShown.map(j=>card(j,"paid")).join("")||emptyC("아직 입금 완료된 현장이 없어요")}${paid.length>8&&!S.showPaidAll?`<button class="btn sm ghost more-btn" data-act="paid-all" type="button">${paid.length-8}건 더 보기</button>`:""}</section>
  </div>
  <div class="grid">
    ${vatPanel(d.jobs).replace('class="panel c4 half"','class="panel c6"')}
    <section class="panel c6">
      <div class="ph"><h2>세무사에게 넘길 자료</h2></div>
      <p class="hint" style="margin:0 0 12px">현장별 공급가액·세액·작성일자·입금일·인건비를 한 파일(CSV, 엑셀에서 열림)로 받아요.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-act="export" data-scope="year" type="button">${YEAR}년 현장 내려받기</button>
        <button class="btn ghost" data-act="export" data-scope="all" type="button">전체 내려받기</button>
      </div>
    </section>
  </div>`;
}

function setPath(o,path,v){ const ks=path.split("."); let t=o; for(let i=0;i<ks.length-1;i++){ t[ks[i]]=t[ks[i]]||{}; t=t[ks[i]]; } t[ks[ks.length-1]]=v; }
function fmtMoneyInput(t){
  const pos=t.selectionStart ?? t.value.length; const right=t.value.slice(pos).replace(/\D/g,"").length;
  const raw=t.value.replace(/\D/g,""); const v=raw===""?"":won(+raw); t.value=v;
  let p=v.length, cnt=0; while(p>0 && cnt<right){ p--; if(/\d/.test(v[p])) cnt++; }
  try{ t.setSelectionRange(p,p); }catch(_){}
}

function cleanJob(d){

    const wasNew=!E.id, id=E.id, fd=E.fromDoc;
    const ok=await act(async()=>{ await store.set("jobs",id,data); closeSheet(); }, wasNew?"새 현장을 등록했어요":"저장했어요");
    if(ok && fd && fd.propIdx!=null && IN.props[fd.propIdx]){ IN.props[fd.propIdx].saved=true; if(IN.props.some(p=>!p.saved) || IN.inv.some(v=>!v.applied)) openIntake(); }

async function addFiles(list){

async function runQueue(){
  IN.busy=true; IN.stop=false;
  try{
    for(const it of IN.items){
      if(it.st!=="wait") continue;
      if(IN.stop){ it.st="err"; it.msg="읽기를 멈췄어요"; continue; }
      await processItem(it); renderIntake();
    }
  } finally { IN.busy=false; IN.stop=false; IN.ctl=null; renderIntake(); }
}
async function processItem(it){
  if(DEMO_SITE && !S.sample && !(it.file && /\.(xlsx|xls|csv)$/i.test(it.name))){ it.st="err"; it.msg="체험판에서는 실제 파일을 읽지 않아요. 위의 예시 서류로 해 보세요(홈택스 목록 엑셀은 읽혀요)"; return; }
  it.st="read"; renderIntake();
  try{
    const ex = it.text!==undefined ? {text:it.text, images:[]} : await extractFile(it.file);
    if(ex.hometax){ const n=addInvoices(ex.hometax, it.name); it.st="done"; it.msg=`홈택스 목록 · 세금계산서 ${n}장`; return; }
    if(!S.sample){ it.st="err"; it.msg="지금 화면에서는 Claude 자동 읽기를 쓸 수 없어요"; return; }
    it.st="ask"; renderIntake();
    const r = normalize(await askClaude(it.name, ex));
    if(r.docType==="invoice" && r.invoices.length){ const n=addInvoices(r.invoices, it.name); it.st="done"; it.msg=`세금계산서 ${n}장`; }
    else if(r.docType==="proposal" && r.proposal){ IN.props.push({file:it.name, data:jobFromProposal(r.proposal, it.name), saved:false}); it.st="done"; it.msg="제안서·견적서"; }
    else { it.st="err"; it.msg="세금계산서나 제안서로 보이지 않아요"+(r.summary?" · "+r.summary:""); }
  }catch(e){ it.st="err"; it.msg=readErr(e); }
}
function readErr(e){
  const c=e&&e.code;
  if(c==="cancelled") return "읽기를 멈췄어요";
  if(c==="not_granted") return "Claude 사용을 허용하지 않아 읽지 못했어요. 페이지를 다시 열면 다시 물어봐요";
  if(c==="sampling_disabled") return "이 계정에서는 Claude 자동 읽기를 쓸 수 없어요";
  if(c==="rate_limited") return "Claude 사용량이 많아요. 잠시 뒤 다시 넣어 주세요";
  if(c==="session_expired") return "claude.ai에 다시 로그인해 주세요";
  if(c==="image_rejected"||c==="images_unavailable") return "그림을 보내지 못했어요. PDF나 다른 사진으로 넣어 주세요";
  if(c==="prompt_too_large") return "서류가 너무 길어요. 필요한 쪽만 PDF로 넣어 주세요";
  if(c==="invalid_json"||c==="empty_completion") return "읽은 내용을 정리하지 못했어요. 한 번 더 넣어 주세요";
  if(c==="refused") return "Claude가 이 서류를 읽지 않았어요";
  if(c) return "읽는 중 연결이 끊겼어요. 한 번 더 넣어 주세요";
  return (e&&e.message) || "읽지 못했어요";
}
async function extractFile(f){
  const ext=((f.name||"").split(".").pop()||"").toLowerCase();
  if(/^image\//.test(f.type) || ["jpg","jpeg","png","webp","gif","heic","heif"].includes(ext)){
    if(!S.sampleImg) throw new Error("지금 화면에서는 사진을 읽을 수 없어요. PDF로 넣어 주세요");
    return {text:"", images:[await prepImage(f)]};
  }
  if(ext==="pdf" || f.type==="application/pdf") return pdfExtract(f);
  if(["xlsx","xls","csv"].includes(ext)) return sheetExtract(f);
  if(["docx","pptx","hwpx"].includes(ext)) return {text:await zipText(f,ext), images:[]};
  if(ext==="hwp") throw new Error("한글(.hwp) 파일은 PDF로 저장해서 넣어 주세요");
  if(ext==="doc"||ext==="ppt") throw new Error("예전 형식 파일이에요. PDF로 저장해서 넣어 주세요");
  if(["txt","md","eml"].includes(ext) || /^text\//.test(f.type)) return {text:(await f.text()).slice(0,30000), images:[]};
  throw new Error("읽을 수 없는 형식이에요. PDF나 사진으로 넣어 주세요");
}
async function prepImage(f){
  const lim=S.sampleImg;
  if(lim && lim.mediaTypes.includes(f.type) && f.size<=Math.min(lim.maxInputBytes, 8e6)) return f;
  let bmp; try{ bmp=await createImageBitmap(f); }catch(_){ throw new Error("이 사진 형식은 읽을 수 없어요(아이폰 HEIC 등). JPG로 바꿔 넣어 주세요"); }
  const sc=Math.min(1, 2200/Math.max(bmp.width,bmp.height)); const cv=document.createElement("canvas");
  cv.width=Math.round(bmp.width*sc); cv.height=Math.round(bmp.height*sc); cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.88)); if(!b) throw new Error("사진을 준비하지 못했어요"); return b;
}
async function pdfExtract(f){
  await loadScript(LIBS.pdfw); await loadScript(LIBS.pdf);
  const lib=window.pdfjsLib; if(!lib) throw new Error("PDF 읽기 도구를 불러오지 못했어요");
  try{ lib.GlobalWorkerOptions.workerSrc=LIBS.pdfw; }catch(_){}
  let doc; try{ doc=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer()), isEvalSupported:false, useSystemFonts:true}).promise; }

function parseHometax(rows){
  const sq=c=>String(c??"").replace(/\s/g,"");
  const hi=rows.slice(0,20).findIndex(r=>r.some(c=>sq(c)==="승인번호") && r.some(c=>sq(c)==="공급가액"));
  if(hi<0) return null;
  const H=rows[hi].map(sq), at=n=>H.indexOf(n), all=n=>H.map((h,i)=>h===n?i:-1).filter(i=>i>=0);
  let sang=all("상호"); if(sang.length<2) sang=[at("공급자상호"),at("공급받는자상호")]; const iDate=at("작성일자"), iNo=at("승인번호"), iSup=at("공급가액"), iVat=at("세액"), iTot=at("합계금액"), iItem=at("품목명");
  const iRc=H.findIndex(h=>h.includes("영수")||h.includes("청구"));
  const sNum=v=>{ const s=String(v??"").replace(/[^\d-]/g,""); const n=parseInt(s,10); return isNaN(n)?0:n; };
  const out=[];
  for(const r of rows.slice(hi+1)){
    const no=String(r[iNo]??"").trim(); if(!no) continue;
    const rc=iRc>=0?String(r[iRc]??""):"";
    out.push({date:normDate(r[iDate]), approvalNo:no, supplier:String(r[sang[0]]??"").trim(), buyer:String(r[sang[1]]??"").trim(), item:iItem>=0?String(r[iItem]??"").trim():"",
      supply:sNum(r[iSup]), vat:sNum(r[iVat]), total:iTot>=0?sNum(r[iTot]):sNum(r[iSup])+sNum(r[iVat]), receipt:rc.includes("영수")?"영수":rc.includes("청구")?"청구":""});
  }
  const uniq=a=>new Set(a.filter(Boolean)).size, head=rows.slice(0,hi).flat().join(" ");
  const dir=/매입/.test(head)?"purchase":/매출/.test(head)?"sales":(uniq(out.map(o=>o.buyer))<=1&&uniq(out.map(o=>o.supplier))>1)?"purchase":"sales";
  out.forEach(o=>o.dir=dir);
  return out;
}
async function zipText(f,kind){

  const names=Object.keys(zip.files);

    : kind==="pptx" ? names.filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>num(a)-num(b))

      .replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(+d)).replace(/&amp;/g,"&");

function normDate(v){

  if(!m && /^\d{8}$/.test(s)) m=[0,s.slice(0,4),s.slice(4,6),s.slice(6,8)];
  if(!m){ const u=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if(u) m=[0,+u[3]<100?2000+(+u[3]):+u[3],u[1],u[2]]; }
  if(!m) return ""; const y=+m[1], mo=+m[2], d=+m[3]; if(mo<1||mo>12||d<1||d>31) return "";
  return y+"-"+pad(mo)+"-"+pad(d);
}

function nameSim(a,b){
  a=normName(a); b=normName(b); if(!a||!b) return 0; if(a===b) return 1;
  if(a.length>=2 && b.length>=2 && (a.includes(b)||b.includes(a))) return .9;
  const bg=s=>{ const m=new Map(); for(let i=0;i<s.length-1;i++){ const k=s.slice(i,i+2); m.set(k,(m.get(k)||0)+1); } return m; };

const costLabel = v => (/임대|대여|렌탈|렌트/.test(v.item||"")?"장비 임차":"매입")+" · "+[v.supplier,v.item].filter(Boolean).join(" ");
async function applyInvoices(){
  const rows=IN.inv.filter(v=>!v.applied && v.target!=="skip"); if(!rows.length) return;
  if(IN.busy || S.busy) return; IN.busy=true; S.busy=true; renderIntake();
  const work=new Map(), prev=new Map(), created=[]; let n=0, sim=0;
  const get=id=>{ if(!work.has(id)){ const j=realJob(id); if(!j) return null; const p=clone(j); delete p.id; prev.set(id,clone(p)); work.set(id,p); } return work.get(id); };
  try{
    for(const v of rows){
      const docRef={kind:v.dir==="sales"?"invoice":"purchase", name:v.file, at:TODAY};
      if(v.dir==="sales" && v.target==="new"){ created.push(await store.set("jobs",null,cleanJob(newJobFromInvoice(v,docRef)))); }
      else {
        const w=get(v.target); if(!w){ if(String(v.target).startsWith("demo")){ v.applied=true; sim++; } continue; }
        w.docs=[...(w.docs||[]),docRef]; w.updatedAt=nowISO();
        if(v.dir==="sales"){
          w.invoice={status:"issued", date:v.date||TODAY, no:v.approvalNo||""};
          if(!(+w.supply) && v.supply){ w.supply=v.supply; w.vatOn=v.vat>0; }
          if(v.markPaid){ w.received=v.total||calc(w).total; w.receivedAt=v.date||TODAY; }
          await store.patch("jobs",v.target,{invoice:w.invoice, supply:+w.supply||0, vatOn:w.vatOn!==false, received:+w.received||0, receivedAt:w.receivedAt||"", docs:w.docs, updatedAt:w.updatedAt});
        } else {
          w.costs=[...(w.costs||[]),{label:costLabel(v), amount:v.supply}];
          await store.patch("jobs",v.target,{costs:w.costs, docs:w.docs, updatedAt:w.updatedAt});
        }
      }
      v.applied=true; n++;
    }
    const undoAll=async()=>{ for(const id of created) await store.del("jobs",id); for(const [id,p] of prev) await store.set("jobs",id,p); rows.forEach(v=>v.applied=false); renderIntake(); };
    toast(n ? `세금계산서 ${n}장을 반영했어요`+(sim?` · 예시 현장 ${sim}건은 체험판이라 그대로 둬요`:"") : `체험판이라 예시 현장 ${sim}건에는 실제로 반영하지 않았어요. 실제 장부에서는 고른 현장에 바로 들어가요`, n?undoAll:null);
  }catch(e){ toast(errMsg(e)); }
  finally{ IN.busy=false; S.busy=false; renderIntake(); }
}
function jobFromProposal(p,file){
  const own=settings().gear, start=p.start||"", end=(p.end&&p.end>=start)?p.end:start;
  const days=start?diffD(start,end)+1:1;
  const crew=[]; p.crew.forEach(r=>{ const n=Math.max(1,Math.min(10,Math.round(+r.count||1))); for(let k=0;k<n;k++) crew.push({name:"", role:ROLES.includes(r.role)?r.role:"기타", days:+r.days||days, rate:0, paid:false, tbd:true}); });
  const other=[...p.otherGear, ...p.gear.filter(g=>!own.includes(g))];
  const memo=[p.notes, other.length?"보유 목록에 없는 장비: "+other.join(", "):"", p.vatIncluded?"서류 금액이 부가세 포함이라 1.1로 나눠 공급가액을 넣었어요.":""].filter(Boolean).join("\n");
  return {title:p.title, client:p.client, contact:p.contact, venue:p.venue, type:TYPES.includes(p.type)?p.type:guessType(p.title), status:"quote", start, end, setup:p.setup,
    supply:p.supply, vatOn:true, crew, costs:[], gear:p.gear.filter(g=>own.includes(g)), invoice:{status:"todo",date:"",no:""}, received:0, receivedAt:"", memo, docs:[{kind:"proposal",name:file,at:TODAY}]};
}
function findDup(d){
  let best=null, bs=0;
  S.real.jobs.forEach(j=>{ if(j.status==="cancel") return;
    const cs=nameSim(d.client,j.client), ts=nameSim(d.title,j.title), dd=(d.start&&j.start)?Math.abs(diffD(d.start,j.start)):99; let s=0;
    if(cs>=0.6) s+=cs*50; if(ts>=0.5) s+=ts*30; if(dd===0) s+=30; else if(dd<=3) s+=15; if(s>bs){ bs=s; best=j; } });
  return bs>=60 ? best : null;
}
function openProp(i){
  const p=IN.props[i]; if(!p) return; const dup=findDup(p.data);
  E={kind:"job", id:null, ro:false, demoView:false, data:clone(p.data), fromDoc:{file:p.file, propIdx:i, dupId:dup?dup.id:null}};
  renderSheet(); sheet.hidden=false; document.body.style.overflow="hidden";
  setTimeout(()=>{ const f=$("#f-title"); f&&f.focus(); },30);
}
function docNote(){
  const f=E.fromDoc; if(!f) return "";
  const dj=(f.dupId && !E.id) ? realJob(f.dupId) : null;
  return `<div class="doc-note"><span><b>‘${esc(f.file)}’에서 읽어 채웠어요.</b> 금액·날짜·인력이 맞는지 확인한 뒤 저장하세요. ${E.id?"":"상태는 ‘견적·문의’로 두었어요."}</span>${dj?`<span>비슷한 현장 <b>‘${esc(dj.title)}’</b>(${fmtD(C(dj).start)})이 이미 있어요. <button class="btn sm" data-act="merge-dup" type="button">그 현장에 합치기</button></span>`:""}${E.id&&f.merged?`<span>기존 현장에 합쳐 두었어요. 저장하면 그 현장이 바뀝니다.</span>`:""}</div>`;
}
function mergeDup(){
  if(!E || !E.fromDoc || !E.fromDoc.dupId) return; const ex=realJob(E.fromDoc.dupId); if(!ex) return;
  const m=clone(ex), x=E.data; delete m.id;
  ["contact","venue","setup","start","end"].forEach(k=>{ if(x[k]) m[k]=x[k]; });
  if(x.supply){ m.supply=x.supply; m.vatOn=x.vatOn; }
  m.gear=[...new Set([...(m.gear||[]),...(x.gear||[])])];
  m.crew=(m.crew&&m.crew.length)?m.crew:(x.crew||[]); m.costs=m.costs||[];
  if(x.memo) m.memo=[m.memo,x.memo].filter(Boolean).join("\n");
  m.docs=[...(m.docs||[]),...(x.docs||[])];
  m.invoice=Object.assign({status:"todo",date:"",no:""}, m.invoice||{});
  E.id=E.fromDoc.dupId; E.data=m; E.fromDoc.merged=true; renderSheet();
}
/* 체험판 전용: 예시 서류 (Claude 없이 미리 정해 둔 읽기 결과로 흐름을 보여 줌) */
function demoInvoices(){
  const f=DEMO.jobs.find(j=>j.title==="가을 문화축제"), m=DEMO.jobs.find(j=>j.title==="팬미팅");
  const no=(d,k)=>d.replace(/-/g,"")+"-41000012-0000"+k;
  const iv=(j,date,k,extra)=>Object.assign({dir:"sales", date, approvalNo:no(date,k), supplier:"사운드오늘", buyer:j.client, item:"", supply:j.supply, vat:Math.floor(j.supply*.1), total:j.supply+Math.floor(j.supply*.1), receipt:"청구"}, extra);
  const pd=addD(C(f).start,-1);
  return [
    iv(f, addD(C(f).end,2), "0101", {item:"축제 무대 음향 운영"}),
    iv(m, addD(C(m).end,1), "0102", {item:"팬미팅 음향", receipt:"영수"}),
    {dir:"purchase", date:pd, approvalNo:no(pd,"0103"), supplier:"G음향렌탈", buyer:"사운드오늘", item:"라인어레이 스피커 임대", supply:1100000, vat:110000, total:1210000, receipt:"청구"}
  ];
}
function demoProposal(){
  return {docType:"proposal", proposal:{title:"신차 발표회", client:"K자동차 마케팅팀", contact:"정 대리 010-0000-0000", venue:"OO컨벤션 그랜드홀", type:"행사 음향",
    start:addD(TODAY,24), end:addD(TODAY,24), setup:addD(TODAY,23), supply:7800000, vatIncluded:false,
    gear:["TT515-A","SUB8008-AS","LV1","AD4Q","AD2","Solidcom C1"], otherGear:["프롬프터 모니터"],
    crew:[{role:"메인 엔지니어",count:1,days:2},{role:"무선·RF",count:1,days:2},{role:"스태프",count:2,days:2}],
    notes:"리허설은 전날 오후 4시\n무선 핸드마이크 6, 핀마이크 4\n무대 뒤 220V 전원 2구 확인 필요"}, summary:"K자동차 신차 발표회 음향 견적서"};
}
function demoDoc(kind){
  const it={key:Math.random().toString(36).slice(2), name: kind==="invoice"?"예시_세금계산서_3장.pdf":"예시_견적서_신차발표회.pdf", st:"ask", msg:""};
  IN.items.push(it); renderIntake();
  setTimeout(()=>{
    if(kind==="invoice"){ const n=addInvoices(demoInvoices(), it.name); it.st="done"; it.msg=n?`세금계산서 ${n}장`:"이미 넣은 예시예요"; }
    else { const r=normalize(demoProposal()); IN.props.push({file:it.name, data:jobFromProposal(r.proposal, it.name), saved:false}); it.st="done"; it.msg="제안서·견적서"; }
    renderIntake();
  }, 1400);
}

/* ───────── 토스트·툴팁 ───────── */
let toastT=null;
function toast(msg,undo){
  const el=$("#toast"); S.undo=undo||null;
  el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" data-act="undo">되돌리기</button>':""}`; el.hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ el.hidden=true; S.undo=null; }, undo?8000:3200);
}
const tip=$("#tip");
function showTip(html,x,y){ tip.innerHTML=html; tip.hidden=false; const r=tip.getBoundingClientRect(); let L=x+14, T=y+14; if(L+r.width>innerWidth-8) L=x-r.width-14; if(T+r.height>innerHeight-8) T=y-r.height-14; tip.style.left=Math.max(8,L)+"px"; tip.style.top=Math.max(8,T)+"px"; }
function hideTip(){ tip.hidden=true; }
const onTipMove = e=>{ const h=e.target.closest&&e.target.closest("[data-mi]"); if(h){ showTip(monthTip(+h.dataset.mi), e.clientX, e.clientY); } else hideTip(); };
view.addEventListener("pointermove", onTipMove);
view.addEventListener("pointerdown", onTipMove);
view.addEventListener("pointerleave", hideTip);
view.addEventListener("focusin", e=>{ const h=e.target.closest&&e.target.closest("[data-mi]"); if(h){ const r=h.getBoundingClientRect(); showTip(monthTip(+h.dataset.mi), r.right, r.top); } });
view.addEventListener("focusout", hideTip);
addEventListener("scroll", hideTip, {passive:true});

/* ───────── 이벤트 ───────── */
document.addEventListener("click", async e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  const k=a.dataset.act, id=a.dataset.id;
  switch(k){
    case "tab": S.tab=a.dataset.tab; try{ localStorage.setItem("oneul.tab",S.tab); }catch(_){} try{ history.replaceState(null,"","#"+S.tab); }catch(_){} render(); scrollTo({top:0}); break;
    case "new": if(S.canWrite) openJob(null); break;
    case "open": if(e.target.closest("button")&&e.target.closest("button")!==a) return; openJob(id); break;
    case "close": { const back=E&&E.fromDoc; closeSheet(); if(back) openIntake(); } break;
    case "save": saveSheet(); break;
    case "del": deleteSheet(); break;
    case "seg": if(!E||E.ro) return; setPath(E.data,a.dataset.k,a.dataset.v); a.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===a)));
      if(a.dataset.k==="invoice.status" && a.dataset.v==="issued" && !E.data.invoice.date){ E.data.invoice.date=TODAY; const f=$("#f-invdate"); if(f) f.value=TODAY; }
      updateSummary(); break;
    case "gear": if(!E||E.ro) return; { const g=a.dataset.v, on=E.data.gear.includes(g); E.data.gear = on ? E.data.gear.filter(x=>x!==g) : [...E.data.gear,g]; a.setAttribute("aria-pressed",String(!on)); } break;
    case "row-add": if(!E||E.ro) return; if(a.dataset.arr==="crew") E.data.crew.push({name:"",role:ROLES[0],days:C(E.data).days||1,rate:0,paid:false}); else E.data.costs.push({label:"",amount:0});
      { const sc=sheet.querySelector(".sheet-body").scrollTop; renderSheet(); sheet.querySelector(".sheet-body").scrollTop=sc; const n=E.data[a.dataset.arr].length-1; const f=$(a.dataset.arr==="crew"?"#f-cr"+n+"-name":"#f-co"+n+"-label"); f&&f.focus(); } break;
    case "row-del": if(!E||E.ro) return; E.data[a.dataset.arr].splice(+a.dataset.i,1); { const sc=sheet.querySelector(".sheet-body").scrollTop; renderSheet(); sheet.querySelector(".sheet-body").scrollTop=sc; } break;
    case "full": if(!E||E.ro) return; { const c=calc(E.data); E.data.received=c.total; const f=$("#f-recv"); if(f) f.value=won(c.total); if(!E.data.receivedAt){ E.data.receivedAt=TODAY; const g=$("#f-recvat"); if(g) g.value=TODAY; } updateSummary(); } break;
    case "issue": e.stopPropagation(); quickIssue(id); break;
    case "paid": e.stopPropagation(); quickPaid(id); break;
    case "paid-all": S.showPaidAll=true; render(); break;
    case "fstatus": S.fStatus=a.dataset.v; render(); break;
    case "month": S.crewMonth=addM(S.crewMonth,+a.dataset.v); render(); break;
    case "payall": payAll(a.dataset.name); break;
    case "crew-new": if(S.canWrite) openCrew(null); break;
    case "crew-open": openCrew(id); break;
    case "biz": if(S.canWrite) saveSettings({bizType:a.dataset.v}); break;
    case "gear-del": if(S.canWrite) saveSettings({gear:settings().gear.filter(g=>g!==a.dataset.v)}); break;
    case "export": exportCSV(a.dataset.scope); break;
    case "intake": if(S.canWrite){ if(E && E.kind==="job" && !E.ro && !sheet.hidden){ toast("편집 중인 현장을 먼저 저장하거나 닫아 주세요"); break; } openIntake(); } break;
    case "read-paste": { const t=(IN.paste||"").trim(); if(!t){ toast("붙여넣은 내용이 없어요"); break; } IN.items.push({key:Math.random().toString(36).slice(2), name:"붙여넣은 내용 · "+t.slice(0,18)+(t.length>18?"…":""), text:t.slice(0,30000), st:"wait", msg:""}); IN.paste=""; renderSheet(); if(!IN.busy) runQueue(); } break;
    case "stop-read": IN.stop=true; if(IN.ctl) IN.ctl.abort(); break;
    case "intake-clear": IN.items=[]; IN.inv=[]; IN.props=[]; renderSheet(); break;
    case "inv-dir": { const v=IN.inv[+a.dataset.i]; if(v && v.dir!==a.dataset.v){ v.dir=a.dataset.v; setInvDefault(v); renderSheet(); } } break;
    case "inv-apply": applyInvoices(); break;
    case "prop-open": openProp(+a.dataset.i); break;
    case "merge-dup": mergeDup(); break;
    case "demo-doc": demoDoc(a.dataset.v); break;
    case "demo-reset": if(DEMO_SITE && store.local){ store.local={jobs:{},crew:{},settings:{}}; store.persist(); toast("내가 넣은 내용을 지웠어요"); } break;
    case "undo": { const u=S.undo; S.undo=null; $("#toast").hidden=true; if(u){ try{ await u(); toast("되돌렸어요"); }catch(err){ toast(errMsg(err)); } } } break;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !sheet.hidden){ closeSheet(); return; }
  if((e.key==="Enter"||e.key===" ") && e.target.matches("li[data-act],tr[data-act],article[data-act]")){ e.preventDefault(); e.target.click(); }
  if(e.key==="Enter" && (e.metaKey||e.ctrlKey) && !sheet.hidden){ saveSheet(); }
});
document.addEventListener("submit", e=>{
  const f=e.target; if(f.dataset.form!=="gear") return; e.preventDefault();
  const inp=$("#f-gear-new"); const v=(inp.value||"").trim(); if(!v) return;
  if(settings().gear.includes(v)){ toast("이미 있는 장비예요"); return; }
  saveSettings({gear:[...settings().gear,v]});
});
view.addEventListener("input", e=>{
  if(e.target.id==="f-q"){ S.q=e.target.value; clearTimeout(view._qt); view._qt=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const n=$("#f-q"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } },180); }
  if(e.target.id==="f-period"){ S.fPeriod=e.target.value; render(); }
  if(e.target.id==="f-type"){ S.fType=e.target.value; render(); }
});
sheet.addEventListener("change", e=>{
  if(E && E.kind==="intake" && e.target.id==="f-files"){ const fs=e.target.files; if(fs && fs.length) addFiles(fs); try{ e.target.value=""; }catch(_){} }
});
document.addEventListener("dragover", e=>{
  if(!S.canWrite || !e.dataTransfer) return;
  if(Array.from(e.dataTransfer.types||[]).includes("Files")){ e.preventDefault(); const d=$("#drop"); if(d) d.classList.add("over"); }
});
document.addEventListener("dragleave", e=>{ if(e.target && e.target.id==="drop") e.target.classList.remove("over"); });
document.addEventListener("drop", e=>{
  if(!S.canWrite || !e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault(); const files=[...e.dataTransfer.files];
  if(E && E.kind==="job" && !E.ro && !sheet.hidden){ toast("편집 중인 현장을 먼저 저장하거나 닫아 주세요"); return; }
  if(!E || E.kind!=="intake" || sheet.hidden) openIntake();
  addFiles(files);
});
let rzT=null;
if("ResizeObserver" in window){ new ResizeObserver(()=>{ clearTimeout(rzT); rzT=setTimeout(drawMonthly,80); }).observe(view); }

render();
store.init();
})();
